        nombre:
          type: string
          example: Robert C. Martin
        nacionalidad:
          type: string
          example: Estadounidense

    CreateAutorDto:
      type: object
      required:
        - nombre
        - nacionalidad
      properties:
        nombre:
          type: string
          example: Robert C. Martin
        nacionalidad:
          type: string
          example: Estadounidense

    CategoriaDto:
      type: object
      required:
        - id
        - nombre
        - descripcion
      properties:
        id:
          type: integer
          example: 1
        nombre:
          type: string
          example: Ingeniería de Software
        descripcion:
          type: string
          example: Obras relacionadas con el desarrollo y diseño de sistemas informáticos.

    CreateCategoriaDto:
      type: object
      required:
        - nombre
        - descripcion
      properties:
        nombre:
          type: string
          example: Ingeniería de Software
        descripcion:
          type: string
          example: Obras relacionadas con el desarrollo y diseño de sistemas informáticos.

    EditorialDto:
      type: object
      required:
        - id
        - nombre
      properties:
        id:
          type: integer
          example: 1
        nombre:
          type: string
          example: Prentice Hall

    CreateEditorialDto:
      type: object
      required:
        - nombre
      properties:
        nombre:
          type: string
          example: Prentice Hall

    PrestamoDto:
      type: object
      required:
