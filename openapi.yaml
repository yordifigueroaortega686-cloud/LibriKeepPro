          example: Activo

    RegistrarPrestamoDto:
      type: object
      required:
        - usuarioId
        - ejemplarId
      properties:
        usuarioId:
          type: integer
          example: 10
        ejemplarId:
          type: integer
          example: 1
        fechaDevolucion:
          type: string
          format: date-time
          example: "2026-07-23T12:00:00Z"

    ProcesarDevolucionDto:
      type: object
      required:
        - codigoBarras
        - estadoEntrega
        - observaciones
      properties:
        codigoBarras:
          type: string
          example: "9780134494166-C1"
        estadoEntrega:
          type: string
          enum: [Bueno, Dañado, Pérdida]
          example: Bueno
        observaciones:
          type: string
