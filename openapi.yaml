        idioma:
          type: string
          example: Español
        pais:
          type: string
          example: Estados Unidos
        tipoMaterial:
          type: string
          enum: [LibroFisico, LibroDigital, Revista, Tesis, Otro]
          example: LibroFisico

    PaginatedBooks:
      type: object
      required:
        - totalItems
        - page
        - pageSize
        - totalPages
        - items
      properties:
        totalItems:
          type: integer
          example: 100
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 10
        totalPages:
          type: integer
          example: 10
        items:
          type: array
          items:
            $ref: '#/components/schemas/BookDto'

    EjemplarDto:
      type: object
      required:
        - id
        - libroId
        - codigoBarras
        - estado
        - ubicacionFisica
        - observaciones
      properties:
        id:
          type: integer
          example: 1
        libroId:
          type: integer
          example: 1
        codigoBarras:
          type: string
          example: "9780134494166-C1"
        estado:
          type: string
          enum: [Disponible, Prestado, EnSala, Mantenimiento, Pérdida, Reservado]
