        prestamoId:
          type: integer
          example: 45
        fechaDevolucionEfectiva:
          type: string
          format: date-time
          example: "2026-07-13T10:00:00Z"
        diasRetraso:
          type: integer
          example: 1
        penalizacionAplicada:
          type: boolean
          example: true
        sancion:
          $ref: '#/components/schemas/SancionDto'
        nuevoEstadoEjemplar:
          type: string
          enum: [Disponible, Reservado, Mantenimiento, Pérdida]
          example: Reservado

    ReservaDto:
      type: object
      required:
        - id
        - usuarioId
        - usuarioNombre
        - libroId
        - libroTitulo
        - fechaReserva
        - posicionCola
        - estado
      properties:
        id:
          type: integer
          example: 12
        usuarioId:
          type: integer
          example: 10
        usuarioNombre:
          type: string
          example: Juan Pérez
        libroId:
          type: integer
          example: 1
        libroTitulo:
          type: string
          example: Clean Architecture
        fechaReserva:
          type: string
          format: date-time
          example: "2026-07-13T12:00:00Z"
        posicionCola:
          type: integer
          example: 1
        estado:
          type: string
          enum: [Activa, Procesada, Cancelada, Vencida]
          example: Activa

    CrearReservaDto:
      type: object
      required:
        - usuarioId
        - libroId
      properties:
        usuarioId:
          type: integer
          example: 10
        libroId:
          type: integer
          example: 1

    SancionDto:
      type: object
      required:
        - id
        - usuarioId
        - prestamoId
        - fechaInicio
        - fechaFin
        - diasSancion
        - estado
      properties:
        id:
          type: integer
          example: 22
        usuarioId:
          type: integer
          example: 10
        prestamoId:
          type: integer
          example: 45
        fechaInicio:
          type: string
          format: date-time
          example: "2026-07-13T10:00:00Z"
        fechaFin:
          type: string
          format: date-time
          example: "2026-07-15T10:00:00Z"
        diasSancion:
          type: integer
          example: 2
        estado:
          type: string
          enum: [Activa, Expirada, Levantada]
          example: Activa

    PaginatedPrestamos:
      type: object
      required:
        - totalItems
        - page
        - pageSize
        - totalPages
        - items
      properties:
        totalItems:
          type: integer
          example: 50
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 10
        totalPages:
          type: integer
          example: 5
        items:
          type: array
          items:
            $ref: '#/components/schemas/PrestamoDto'

    ConfiguracionDto:
      type: object
      required:
        - maxPrestamosAlumno
        - maxPrestamosDocente
        - maxPrestamosAdministrativo
        - diasPrestamoDefecto
        - diasSuspensionPorDiaRetraso
        - horasGraciaReserva
      properties:
        maxPrestamosAlumno:
          type: integer
          example: 3
        maxPrestamosDocente:
          type: integer
          example: 5
        maxPrestamosAdministrativo:
          type: integer
          example: 3
        diasPrestamoDefecto:
          type: integer
          example: 7
        diasSuspensionPorDiaRetraso:
          type: integer
          example: 2
        horasGraciaReserva:
          type: integer
          example: 48

    EstadisticasDto:
      type: object
      required:
        - totalEjemplares
        - prestamosActivos
        - tasaMorosidad
        - usuariosBloqueados
      properties:
        totalEjemplares:
          type: integer
          example: 1240
        prestamosActivos:
          type: integer
          example: 142
        tasaMorosidad:
          type: number
          format: float
          example: 4.2
        usuariosBloqueados:
          type: integer
          example: 8

    ReporteMasSolicitadoDto:
      type: object
      required:
        - rank
        - libroId
        - titulo
        - autorNombre
        - totalPrestamos
      properties:
        rank:
          type: integer
          example: 1
        libroId:
          type: integer
          example: 1
        titulo:
          type: string
          example: Clean Architecture
        autorNombre:
          type: string
          example: Robert C. Martin
        totalPrestamos:
          type: integer
          example: 48

    ReporteEjemplarProblemaDto:
      type: object
      required:
        - ejemplarId
        - codigoBarras
        - libroTitulo
        - estado
        - observaciones
        - ultimaFechaActualizacion
      properties:
        ejemplarId:
          type: integer
          example: 102
        codigoBarras:
          type: string
          example: "9780134494166-C3"
        libroTitulo:
          type: string
          example: Clean Architecture
        estado:
          type: string
          enum: [Mantenimiento, Pérdida]
          example: Mantenimiento
        observaciones:
          type: string
          example: "Daño severo en portada"
        ultimaFechaActualizacion:
          type: string
          format: date-time
          example: "2026-07-10T15:30:00Z"

    ReporteUsuarioMorosoDto:
      type: object
      required:
        - usuarioId
        - dni
        - nombreCompleto
        - email
        - prestamosVencidosCount
        - sancionesActivasCount
        - estadoUsuario
      properties:
        usuarioId:
          type: integer
          example: 10
        dni:
          type: string
          example: "71234567"
        nombreCompleto:
          type: string
          example: Juan Pérez
        email:
          type: string
          format: email
          example: alumno@uni.edu.pe
        prestamosVencidosCount:
          type: integer
          example: 1
        sancionesActivasCount:
          type: integer
          example: 1
        estadoUsuario:
          type: string
          example: BloqueoTemporal

    ErrorResponse:
      type: object
      required:
        - code
        - title
        - detail
      properties:
        code:
          type: string
          description: Código único de error empresarial (p. ej., ERR_USER_SANCTIONED, ERR_COPY_NOT_AVAILABLE, ERR_MAX_LOANS_EXCEEDED).
          example: ERR_USER_SANCTIONED
        title:
          type: string
          description: Nombre legible o categoría del error.
          example: INFRACCIÓN DE REGLA DE NEGOCIO
        detail:
          type: string
          description: Explicación detallada del error, apta para ser visualizada en la interfaz de usuario.
          example: El alumno Juan Pérez cuenta con una sanción activa vigente hasta 23/07/2026.
