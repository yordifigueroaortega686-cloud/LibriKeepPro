        - usuarioId
        - usuarioNombre
        - ejemplarId
        - ejemplarCodigoBarras
        - libroTitulo
        - fechaSalida
        - fechaMaxDevolucion
        - fechaDevolucionEfectiva
        - estado
      properties:
        id:
          type: integer
          example: 45
        usuarioId:
          type: integer
          example: 10
        usuarioNombre:
          type: string
          example: Juan Pérez
        ejemplarId:
          type: integer
          example: 1
        ejemplarCodigoBarras:
          type: string
          example: "9780134494166-C1"
        libroTitulo:
          type: string
          example: Clean Architecture
        fechaSalida:
          type: string
          format: date-time
          example: "2026-07-05T08:00:00Z"
        fechaMaxDevolucion:
          type: string
          format: date-time
          example: "2026-07-12T08:00:00Z"
        fechaDevolucionEfectiva:
          type: string
          format: date-time
          nullable: true
          example: null
        estado:
          type: string
