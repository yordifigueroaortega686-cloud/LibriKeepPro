        - observaciones
      properties:
        codigoBarras:
          type: string
          example: "9780134494166-C1"
        ubicacionFisica:
          type: string
          example: "Estante A - Fila 3"
        observaciones:
          type: string
          example: "En perfectas condiciones"

    UpdateEjemplarDto:
      type: object
      required:
        - estado
        - ubicacionFisica
        - observaciones
      properties:
        estado:
          type: string
          enum: [Disponible, Prestado, EnSala, Mantenimiento, Pérdida, Reservado]
          example: Disponible
        ubicacionFisica:
          type: string
          example: "Estante A - Fila 3"
        observaciones:
          type: string
          example: "Desgaste leve en lomo"

    AutorDto:
